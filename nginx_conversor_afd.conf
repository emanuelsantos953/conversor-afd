server {
    listen 9445 ssl;
    server_name sistemasweb.taquarituba.sp.gov.br;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/sistemasweb.taquarituba.sp.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemasweb.taquarituba.sp.gov.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /static/ {
        alias /home/adminvm/conversor-afd/staticfiles/;
    }

    location /ws/ {
        proxy_pass http://unix:/home/adminvm/conversor-afd/conversor.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://unix:/home/adminvm/conversor-afd/conversor.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
