{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Funcionários</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #e0e0e0; }
        
        /* Caixa de busca e Select alinhados perfeitamente */
        .search-box { 
            width: 100%; 
            height: 48px; 
            padding: 0 12px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 16px; 
            box-sizing: border-box; 
            font-family: inherit; 
            outline: none; 
        }
        .search-box:focus {
            border-color: #417690;
        }
        
        .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card" style="max-width: 1200px; margin: 20px auto;">
        <div class="card-header">
            Gerenciar Funcionários
        </div>
        <div class="card-body">
            
            <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;">
             <a href="{% url 'cadastrar_funcionario' %}" style="text-decoration: none; flex: 1; min-width: 170px; display: flex;">
                 <button class="btn btn-primary" style="margin-bottom: 0; width: 100%; height: 100%;">+ Cadastrar Novo</button>
             </a>
             <a href="{% url 'importar_funcionarios' %}" style="text-decoration: none; flex: 1; min-width: 170px; display: flex;">
                 <button class="btn btn-primary" style="margin-bottom: 0; background-color: #5cb85c; width: 100%; height: 100%;">↑ Importar Funcionários</button>
             </a>
             <a href="{% url 'importar_afd' %}" style="text-decoration: none; flex: 1; min-width: 170px; display: flex;">
                 <button class="btn btn-primary" style="margin-bottom: 0; background-color: #ffb74d; color: #333; width: 100%; height: 100%;">⏰ Importar AFD</button>
             </a>
             <a href="{% url 'importar_planilha' %}" style="text-decoration: none; flex: 1; min-width: 170px; display: flex;">
             <button class="btn btn-primary" style="margin-bottom: 0; background-color: #17a2b8; color: white; width: 100%; height: 100%;">📊 Importar XLS</button>
             </a>
             <a href="{% url 'exportar_afd' %}" style="text-decoration: none; flex: 1; min-width: 170px; display: flex;">
                 <button class="btn btn-primary" style="margin-bottom: 0; background-color: #28a745; color: white; width: 100%; height: 100%;">💾 Exportar AFD</button>
             </a>
             <a href="{% url 'gerenciar_grupos' %}" style="text-decoration: none; flex: 1; min-width: 170px; display: flex;">
                 <button class="btn btn-primary" style="margin-bottom: 0; background-color: #6f42c1; color: white; width: 100%; height: 100%;">📁 Gerenciar Grupos</button>
             </a>
             <a href="{% url 'cadastro_ignorados' %}" style="text-decoration: none; flex: 1; min-width: 170px; display: flex;">
                 <button class="btn btn-primary" style="margin-bottom: 0; background-color: #dc3545; color: white; width: 100%; height: 100%;">🚫 Cadastro de Ignorados</button>
             </a>
         </div>

            <div class="search-container">
                <input type="text" id="campoBusca" class="search-box" style="flex: 3;" placeholder="Pesquisar por Nome, Matrícula, PIS ou CPF...">
                
                <select id="campoGrupo" class="search-box" style="flex: 1;">
                    <option value="">Todos os Grupos</option>
                    {% for grupo in grupos %}
                        {% if grupo %}
                            <option value="{{ grupo }}">{{ grupo }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Matrícula</th>
                        <th>Nome Completo</th>
                        <th>Grupo</th>
                        <th>PIS</th>
                        <th>CPF</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #777;">Digite pelo menos 3 caracteres ou escolha um grupo para carregar...</td>
                    </tr>
                </tbody>
            </table>

            <a href="{% url 'home' %}" style="text-decoration: none;">
                <button class="btn btn-secondary" style="margin-top: 20px;">Voltar para o Início</button>
            </a>
        </div>
    </div>

    <script>
        const campoBusca = document.getElementById('campoBusca');
        const campoGrupo = document.getElementById('campoGrupo');
        const tbody = document.getElementById('corpoTabela');

        function buscarFuncionarios() {
            let query = campoBusca.value.trim();
            let grupo = campoGrupo.value;

            // Busca se o usuário digitou pelo menos 3 caracteres OU se selecionou algum grupo específico
            if (query.length >= 3 || grupo !== '') {
                
                // Exibe "Carregando..." enquanto o servidor pensa
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #777;">Buscando...</td></tr>';

                // Envia tanto o texto quanto o grupo para o Python (views.py)
                fetch(`{% url 'listar_funcionarios' %}?q=${encodeURIComponent(query)}&grupo=${encodeURIComponent(grupo)}`)
                .then(response => response.json())
                .then(data => {
                    tbody.innerHTML = ''; // Limpa a tabela
                    
                    if (data.funcionarios.length > 0) {
                        // Preenche com os resultados
                        data.funcionarios.forEach(func => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${func.matricula}</td>
                                    <td><a href="/ponto/${func.id}/" style="color: #417690; font-weight: bold; text-decoration: underline;">${func.nome_completo}</a></td>
                                    <td><span style="background-color: #e0e0e0; padding: 2px 6px; border-radius: 4px; font-size: 12px;">${func.grupo}</span></td>
                                    <td>${func.pis}</td>
                                    <td>${func.cpf}</td>
                                </tr>
                            `;
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Nenhum funcionário encontrado com estes filtros.</td></tr>';
                    }
                })
                .catch(error => {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Erro ao buscar dados.</td></tr>';
                });
            } else {
                // Se limpar tudo, volta a mensagem original
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #777;">Digite pelo menos 3 caracteres ou escolha um grupo para carregar...</td></tr>';
            }
        }

        // Os "Ouvintes" ficam prestando atenção em qualquer digitação ou mudança no grupo
        campoBusca.addEventListener('input', buscarFuncionarios);
        campoGrupo.addEventListener('change', buscarFuncionarios);
    </script>
</body>
</html>
