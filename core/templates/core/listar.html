{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Funcionários</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #e0e0e0; }
        .search-box { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card" style="max-width: 800px;">
        <div class="card-header">
            Gerenciar Funcionários
        </div>
        <div class="card-body">
            
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <a href="{% url 'cadastrar_funcionario' %}" style="text-decoration: none; flex: 1;">
                    <button class="btn btn-primary" style="margin-bottom: 0;">+ Cadastrar Novo</button>
                </a>
                <a href="{% url 'importar_funcionarios' %}" style="text-decoration: none; flex: 1;">
                    <button class="btn btn-primary" style="margin-bottom: 0; background-color: #5cb85c;">↑ Importar Arquivo</button>
                </a>
            </div>

            <input type="text" id="campoBusca" class="search-box" placeholder="Pesquisar funcionário por nome (mínimo 3 letras)...">
            
            <table>
                <thead>
                    <tr>
                        <th>Matrícula</th>
                        <th>Nome Completo</th>
                        <th>PIS</th>
                        <th>CPF</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr>
                        <td colspan="4" style="text-align: center; color: #777;">Digite pelo menos 3 letras para carregar os dados...</td>
                    </tr>
                </tbody>
            </table>

            <a href="{% url 'home' %}" style="text-decoration: none;">
                <button class="btn btn-secondary" style="margin-top: 20px;">Voltar para o Início</button>
            </a>
        </div>
    </div>

    <script>
        document.getElementById('campoBusca').addEventListener('input', function() {
            let query = this.value;
            let tbody = document.getElementById('corpoTabela');

            if (query.length >= 3) {
                // Faz a chamada em segundo plano para o Python
                fetch(`{% url 'listar_funcionarios' %}?q=${query}`)
                .then(response => response.json())
                .then(data => {
                    tbody.innerHTML = ''; // Limpa a tabela
                    
                    if (data.funcionarios.length > 0) {
                        // Preenche com os resultados
                        data.funcionarios.forEach(func => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${func.matricula}</td>
                                    <td><a href="/ponto/${func.id}/" style="color: #417690; font-weight: bold; text-decoration: underline;">${func.nome_completo}</a></td>
                                    <td>${func.pis}</td>
                                    <td>${func.cpf}</td>
                                </tr>
                            `;
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: red;">Nenhum funcionário encontrado com esse nome.</td></tr>';
                    }
                });
            } else {
                // Se apagar ou tiver menos de 3 letras, esconde tudo novamente
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #777;">Digite pelo menos 3 letras para carregar os dados...</td></tr>';
            }
        });
    </script>
</body>
</html>
