{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Funcionário</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        .error-message { color: red; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card" style="max-width: 600px; margin: 40px auto;">
        <div class="card-header">
            Cadastrar Novo Funcionário
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="form-group">
                        {{ field.label_tag }}
                        {{ field }}
                        {% if field.errors %}
                            <div class="error-message">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px; font-size: 16px;">💾 Salvar Funcionário</button>
            </form>
            
            <a href="{% url 'listar_funcionarios' %}" style="text-decoration: none;">
                <button class="btn btn-secondary" style="width: 100%; margin-top: 10px;">Cancelar / Voltar</button>
            </a>
        </div>
    </div>
</body>
</html>
