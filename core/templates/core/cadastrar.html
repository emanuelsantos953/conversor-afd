{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Sistema AFD</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="card">
        <div class="card-header">
            Cadastrar Funcionário
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Salvar Dados</button>
            </form>
            <a href="{% url 'home' %}" style="text-decoration: none;">
                <button class="btn btn-secondary">Voltar para o Início</button>
            </a>
        </div>
    </div>
</body>
</html>
