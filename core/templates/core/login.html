<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema | Conversor AFD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e0e1dd;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            color: #1b263b;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: #1a73e8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px auto;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.4);
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0d1b2a;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #555b6e;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .badge-fiorilli {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e8f0fe;
            color: #1a73e8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid #c2e7ff;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #34a853;
            border-radius: 50%;
            display: inline-block;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #415a77;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background-color: #f8f9fa;
            border: 1.5px solid #d0d7de;
            color: #1b263b;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #1a73e8;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #1a73e8;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #1557b0;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(26, 115, 232, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background-color: #fde8e8;
            color: #9b1c1c;
            border: 1px solid #f8b4b4;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 18px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #778da9;
            line-height: 1.5;
            border-top: 1px solid #edf2f7;
            padding-top: 16px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-icon">⏱️</div>
    <h2>Conversor AFD</h2>
    <p class="subtitle">Gestão & Integração de Ponto Eletrônico</p>

    <div class="badge-fiorilli">
        <span class="badge-dot"></span> Autenticação Integrada Fiorilli SIP
    </div>

    {% if form.errors %}
        <div class="error">
            <span>⚠️</span> Usuário ou senha incorretos na Fiorilli ou acesso local.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Usuário Fiorilli / Operador</label>
            <input type="text" id="id_username" name="username" placeholder="Ex: maria.silva" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
            <label for="id_password">Senha</label>
            <input type="password" id="id_password" name="password" placeholder="Sua senha do sistema" required autocomplete="current-password">
        </div>

        <button type="submit">Entrar no Sistema</button>
    </form>

    <div class="footer">
        Prefeitura Municipal de Taquarituba<br>
        Integração com <strong>SIPWebservices Fiorilli</strong>
    </div>
</div>

</body>
</html>
