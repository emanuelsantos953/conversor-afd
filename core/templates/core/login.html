<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acesso Restrito | Conversor AFD</title>

    <style>

        body {

            background-color: #ffffff;

            color: #e0e0e0;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            margin: 0;

        }

        .login-card {

            background-color: #ffffff;

            padding: 40px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);

            width: 100%;

            max-width: 350px;

            text-align: center;

            border: 1px solid #333;

        }

        h2 { margin-bottom: 20px; color: #252525; }

        input {

            width: 100%;

            padding: 12px;

            margin: 10px 0;

            background-color: #2c2c2c;

            border: 1px solid #444;

            color: white;

            border-radius: 5px;

            box-sizing: border-box; /* Garante que o padding não estoure a largura */

        }

        input:focus { outline: none; border-color: #007bff; }

        button {

            width: 100%;

            padding: 12px;

            background-color: #007bff;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

            margin-top: 10px;

            transition: background 0.3s;

        }

        button:hover { background-color: #0056b3; }

        .error { color: #ff6b6b; font-size: 0.9em; margin-bottom: 10px; }

        .footer { margin-top: 20px; font-size: 0.8em; color: #666; }

    </style>

</head>

<body>



<div class="login-card">

    <h2>🔐 Acesso</h2>

   

    {% if form.errors %}

        <div class="error">Usuário ou senha incorretos.</div>

    {% endif %}



    <form method="post">

        {% csrf_token %}

        <input type="text" name="username" placeholder="Usuário" required autofocus>

        <input type="password" name="password" placeholder="Senha" required>

        <button type="submit">Entrar</button>

    </form>

   

    <div class="footer">

        Conversor AFD v1.0<br>

        Acesso restrito a autorizados via SSH.

    </div>

</div>



</body>

</html>
