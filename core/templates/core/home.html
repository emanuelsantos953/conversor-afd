<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <style>
        body {
            background-color: #ffffff; 
            font-family: 'Roboto', arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .btn {
            width: 220px;
            height: 48px;
            margin: 8px 0;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, box-shadow 0.2s;
            border: none;
            letter-spacing: 0.25px;
            color: white;
        }

        /* AZUL (Google Blue) - Sistema AFD */
        .btn-primary {
            background-color: #1a73e8;
        }
        .btn-primary:hover {
            background-color: #1557b0;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        /* VERDE (Google Green) - Sistema Bingo B75 */
        .btn-success {
            background-color: #1e8e3e;
            font-size: 18px; /* Um pouco maior para o número destacar */
            font-weight: bold;
        }
        .btn-success:hover {
            background-color: #137333;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        /* CINZA (Logout) */
        .btn-secondary {
            background-color: #f8f9fa;
            color: #3c4043;
            border: 1px solid #f8f9fa;
            font-size: 14px;
        }
        .btn-secondary:hover {
            background-color: #e8eaed;
            color: #202124;
            border-color: #dadce0;
        }

        form { margin: 0; padding: 0; }
    </style>
</head>
<body>

    <a href="{% url 'listar_funcionarios' %}" class="btn btn-primary">
        Gerenciar AFD
    </a>

    <a href="{% url 'home_bingo' %}" class="btn btn-success" title="Acessar Sistema Bingo 75">
        75
    </a>

    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-secondary">
            Logout
        </button>
    </form>

</body>
</html>
