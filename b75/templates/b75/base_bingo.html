<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bingo B75{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --sidebar-width: 240px;
            --primary-color: #1e293b;
            --accent-color: #3b82f6;
            --text-light: #f8fafc;
        }

        body { margin: 0; font-family: 'Roboto', sans-serif; display: flex; height: 100vh; background-color: #f1f5f9; }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--primary-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100%;
        }

        .sidebar-header { padding: 20px; font-size: 1.5rem; font-weight: bold; border-bottom: 1px solid #334155; text-align: center; }

        .sidebar-menu { flex: 1; padding: 10px 0; }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #cbd5e1;
            text-decoration: none;
            transition: 0.3s;
            font-weight: 500;
        }

        .menu-item i { margin-right: 15px; font-size: 1.2rem; }
        .menu-item:hover { background-color: #334155; color: white; }
        .menu-item.active { background-color: var(--accent-color); color: white; }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header">BINGO B75</div>
        <div class="sidebar-menu">
            <a href="{% url 'home_bingo' %}" class="menu-item {% if request.resolver_match.url_name == 'home_bingo' %}active{% endif %}">
                <i class="bi bi-house"></i> Início
            </a>
            <a href="{% url 'gerenciar_clientes' %}" class="menu-item {% if 'clientes' in request.path %}active{% endif %}">
                <i class="bi bi-people"></i> Clientes
            </a>
            <a href="{% url 'pdv' %}" class="menu-item {% if 'pdv' in request.path %}active{% endif %}">
                <i class="bi bi-cart"></i> Vendas (PDV)
            </a>
            <a href="{% url 'gerenciar_produtos' %}" class="menu-item {% if 'vendas' in request.path or 'produtos' in request.path %}active{% endif %}">
                <i class="bi bi-box-seam"></i> Estoque
            </a>
            <a href="{% url 'cobranca' %}" class="menu-item {% if 'cobranca' in request.path %}active{% endif %}">
                <i class="bi bi-cash-stack"></i> Cobrança
            </a>
            <a href="{% url 'historico_pagamentos' %}" class="menu-item {% if 'historico' in request.path %}active{% endif %}">
                <i class="bi bi-clock-history"></i> Histórico
            </a>
        </div>
        <div style="padding: 20px; border-top: 1px solid #334155;">
            <a href="{% url 'home' %}" class="menu-item" style="color: #ef4444;">
                <i class="bi bi-box-arrow-left"></i> Sair do Bingo
            </a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
